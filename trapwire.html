<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>TRAPWIRE — Arena Trap Combat</title>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --p1:#4cc9f0; --p2:#ffb703; --p3:#ff5d8f; --p4:#3ddc97;
  --radius:14px; --radius-sm:9px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="neon"]{
  --bg:#070a14; --bg2:#0c1120; --surface:#111a2e; --surface2:#16223b;
  --line:#22314f; --line-soft:#1a2540;
  --text:#e8f0ff; --muted:#93a4c4; --faint:#63769a;
  --accent:#4dd8ff; --accent-ink:#05121c; --accent-soft:rgba(77,216,255,.14);
  --good:#3ddc97; --warn:#ffb703; --bad:#ff4d6d;
  --glow:0 0 0 1px rgba(77,216,255,.22), 0 8px 30px rgba(0,0,0,.55);
}
html[data-theme="tactical"]{
  --bg:#14150f; --bg2:#1a1c14; --surface:#22251b; --surface2:#2b2f22;
  --line:#3a3f2d; --line-soft:#2f3427;
  --text:#eae7d8; --muted:#a8a794; --faint:#7b7b68;
  --accent:#c8b273; --accent-ink:#14150f; --accent-soft:rgba(200,178,115,.14);
  --good:#94b06a; --warn:#d9a441; --bad:#c65a3f;
  --glow:0 0 0 1px rgba(200,178,115,.2), 0 8px 30px rgba(0,0,0,.5);
}
html[data-theme="contrast"]{
  --bg:#000000; --bg2:#0a0a0a; --surface:#141414; --surface2:#1e1e1e;
  --line:#4a4a4a; --line-soft:#333;
  --text:#ffffff; --muted:#cfcfcf; --faint:#9a9a9a;
  --accent:#ffe600; --accent-ink:#000; --accent-soft:rgba(255,230,0,.16);
  --good:#00e676; --warn:#ffab00; --bad:#ff1744;
  --glow:0 0 0 2px rgba(255,230,0,.35), 0 8px 30px rgba(0,0,0,.8);
  --p1:#00e5ff; --p2:#ffe600; --p3:#ff45c8; --p4:#00ff85;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ============================================================
   SHELL / SCREENS
   ============================================================ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none}
.screen.on{display:block}
.screen.flexed.on{display:flex;flex-direction:column}
.pad{max-width:1260px;margin:0 auto;padding:calc(20px + var(--safe-t)) 18px calc(28px + var(--safe-b))}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-weight:600;font-size:14.5px;transition:.14s ease;white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface);color:var(--text)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.xs{min-height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* segmented control */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:60px;min-height:38px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:13px;font-weight:600;transition:.13s;
}
.seg button:hover{color:var(--text);border-color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.tight button{min-height:32px;font-size:12.5px;min-width:0}

/* ============================================================
   TITLE SCREEN
   ============================================================ */
#menu .hero{
  min-height:100%;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:6px;padding:40px 18px;
  padding-top:calc(40px + var(--safe-t));padding-bottom:calc(40px + var(--safe-b));
}
.logo{
  font-size:clamp(38px,11vw,76px);font-weight:800;letter-spacing:.16em;
  line-height:1;margin-bottom:2px;
  background:linear-gradient(180deg,var(--text),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px var(--accent-soft);
}
.tagline{color:var(--muted);font-size:14px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:22px}
.countrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.countlabel{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.countrow .seg button{min-width:46px}
.menu-actions{display:flex;flex-direction:column;gap:10px;width:min(340px,100%);margin-bottom:18px}
.menu-actions .btn{min-height:52px;font-size:16px}
.menu-note{color:var(--faint);font-size:12.5px;max-width:420px}
.topright{position:absolute;top:calc(12px + var(--safe-t));right:12px;display:flex;gap:6px;z-index:5}

/* ============================================================
   PANELS / CARDS
   ============================================================ */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.panel > h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field > label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
input[type=text]{
  width:100%;min-height:40px;padding:0 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);outline:none;transition:.14s;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setup-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.setup-head h2{font-size:22px}
.setup-head .spacer{flex:1}

/* player slot cards */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.slot{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;position:relative;overflow:hidden;transition:.16s;
}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.slot.off{opacity:.5}
.slot .slot-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slot .tag{
  font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--pc);
  border:1px solid var(--pc);border-radius:6px;padding:2px 6px;
}
.slot .namewrap{display:flex;gap:6px;align-items:center}
.slot .namewrap input{flex:1}
.mini-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:10px 0 5px}
.kitline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.kitpill{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--bg2);
}
.kitpill b{color:var(--text)}
.statbars{display:grid;gap:4px;margin-top:8px}
.statbar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
.statbar .track{flex:1;height:5px;border-radius:3px;background:var(--bg2);overflow:hidden}
.statbar .fill{display:block;height:100%;background:var(--pc);border-radius:3px}

/* trap allocation editor */
.alloc{display:grid;gap:7px}
.allocrow{display:flex;align-items:center;gap:8px}
.allocrow .nm{flex:1;font-size:12.5px;display:flex;align-items:center;gap:7px}
.allocrow .swatch{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.25)}
.allocrow .ct{width:24px;text-align:center;font-weight:800;font-family:var(--mono)}
.stepper{display:flex;gap:4px}
.stepper button{
  width:28px;height:28px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font-weight:800;line-height:1;
}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.budget{font-size:12px;color:var(--muted);margin-top:8px}
.budget b{color:var(--accent)}

/* ============================================================
   GAME SCREEN
   ============================================================ */
#game{background:var(--bg);display:none}
#game.on{display:block}
#stage{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* top bar */
#topbar{
  position:absolute;top:calc(6px + var(--safe-t));left:0;right:0;z-index:6;
  display:flex;align-items:flex-start;gap:8px;padding:0 8px;pointer-events:none;
}
#topbar > *{pointer-events:auto}
.clock{
  background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;
  padding:5px 12px;font-family:var(--mono);font-size:19px;font-weight:800;
  letter-spacing:.04em;backdrop-filter:blur(8px);
}
.clock.urgent{color:var(--bad);border-color:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.55}}
.roundpips{display:flex;gap:4px;align-items:center;justify-content:center;margin-top:4px}
.roundpips i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.roundpips i.won{background:var(--accent)}
.iconbtn{
  width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.55);
  border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px);
}
.iconbtn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.centerstack{flex:1;display:flex;flex-direction:column;align-items:center}

/* player HUD cards */
#hud{
  position:absolute;left:0;right:0;bottom:calc(4px + var(--safe-b));z-index:5;
  display:flex;gap:6px;justify-content:center;padding:0 6px;flex-wrap:wrap;pointer-events:none;
}
body.touchmode #hud{bottom:auto;top:calc(50px + var(--safe-t));flex-wrap:nowrap;gap:4px}
body.touchmode #feed{top:auto;bottom:calc(214px + var(--safe-b));max-width:70%}
body.touchmode .pcard .ptop{min-width:0}
body.touchmode .pcard .pname{flex:1;min-width:0}
body.touchmode .pcard{min-width:0;flex:1 1 0;max-width:none;padding:4px 6px;border-radius:8px}
body.touchmode .pcard .pkind{display:none}
body.touchmode .pcard .ammo{display:none}
body.touchmode .pcard .prow{margin-top:3px;font-size:9.5px}
body.touchmode .traprow{display:flex;gap:2px;margin-top:3px}
body.touchmode .tchip{font-size:9px;padding:0 3px}
body.touchmode .statuspips{min-height:0}
body.touchmode .spip{font-size:8px;padding:0 3px}
body.splitmode #hud,body.splitmode #feed,body.splitmode #spectator{display:none}
body.splitmode #topbar{top:calc(50% - 20px);pointer-events:none}
body.splitmode #topbar .centerstack{transform:scale(.82)}
.pcard{
  background:rgba(0,0,0,.6);border:1px solid var(--line);border-left:3px solid var(--pc);
  border-radius:10px;padding:6px 9px;min-width:126px;max-width:190px;flex:1 1 126px;
  backdrop-filter:blur(8px);transition:.2s;
}
.pcard.dead{opacity:.42;filter:grayscale(1)}
.pcard .ptop{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.pcard .pname{font-size:12.5px;font-weight:800;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pkind{font-size:9.5px;letter-spacing:.09em;color:var(--faint);margin-left:auto;font-weight:700}
.hpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.hpbar > i{display:block;height:100%;background:var(--pc);border-radius:4px;transition:width .18s}
.hpbar > u{position:absolute;top:0;height:100%;background:rgba(255,255,255,.45);transition:width .5s .12s}
.pcard .prow{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10.5px;color:var(--muted)}
.ammo{display:flex;gap:2px}
.ammo i{width:4px;height:9px;border-radius:1.5px;background:var(--pc);display:block}
.ammo i.spent{background:rgba(255,255,255,.16)}
.traprow{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tchip{
  display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;font-family:var(--mono);
  border-radius:5px;padding:1px 4px;background:rgba(255,255,255,.07);color:var(--muted);
}
.tchip.sel{outline:1.5px solid var(--accent);color:var(--text)}
.tchip.zero{opacity:.32}
.tchip .sw{width:8px;height:8px;border-radius:2px}
.statuspips{display:flex;gap:3px;margin-top:4px;min-height:12px}
.spip{font-size:9px;font-weight:800;letter-spacing:.06em;border-radius:4px;padding:1px 5px}
.spip.spd{background:rgba(61,220,151,.2);color:var(--good)}
.spip.shd{background:rgba(255,183,3,.2);color:var(--warn)}
.spip.unit{background:rgba(255,77,109,.22);color:var(--bad)}

/* kill feed + toasts */
#feed{
  position:absolute;right:8px;top:calc(56px + var(--safe-t));z-index:6;
  display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;max-width:56%;
}
.feedline{
  background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;font-size:11.5px;font-weight:600;backdrop-filter:blur(6px);
  animation:slidein .22s ease;
}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}}
#bigmsg{
  position:absolute;left:0;right:0;top:38%;text-align:center;z-index:7;pointer-events:none;
  font-size:clamp(26px,7vw,52px);font-weight:800;letter-spacing:.1em;
  text-shadow:0 4px 30px rgba(0,0,0,.8);opacity:0;transition:opacity .2s;
}
#bigmsg.show{opacity:1}
#bigmsg small{display:block;font-size:.34em;letter-spacing:.2em;color:var(--muted);margin-top:8px;font-weight:700}

/* spectator analytics */
#spectator{
  position:absolute;left:8px;top:calc(56px + var(--safe-t));z-index:6;
  background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;backdrop-filter:blur(8px);font-size:11.5px;min-width:180px;pointer-events:none;
}
#spectator h4{font-size:10px;letter-spacing:.14em;color:var(--faint);margin-bottom:7px;text-transform:uppercase}
.specrow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.specrow .nm{width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pc);font-weight:700}
.specrow .track{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.specrow .track i{display:block;height:100%;background:var(--pc);transition:width .3s}
.specrow .v{width:34px;text-align:right;font-family:var(--mono);color:var(--muted)}

/* ============================================================
   TOUCH CONTROLS
   ============================================================ */
.touchpad{position:absolute;z-index:8;pointer-events:none;user-select:none}
.touchpad .zone{position:absolute;pointer-events:auto}
.stick{
  position:absolute;width:124px;height:124px;border-radius:50%;
  border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  pointer-events:auto;touch-action:none;
}
.stick .knob{
  position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
  border-radius:50%;background:var(--pc);opacity:.75;
  box-shadow:0 2px 12px rgba(0,0,0,.5);transition:opacity .15s;
}
.tbtns{position:absolute;display:grid;gap:8px;pointer-events:auto}
.tbtn{
  width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:var(--text);font-size:10.5px;font-weight:800;
  letter-spacing:.05em;display:grid;place-items:center;touch-action:none;line-height:1.1;
  text-align:center;backdrop-filter:blur(4px);
}
.tbtn.big{width:78px;height:78px;font-size:12px;background:var(--pc);color:#000;opacity:.86}
.tbtn.act{background:var(--accent);color:var(--accent-ink);transform:scale(.94)}
.tbtn.off{opacity:.3}
.tbtn small{display:block;font-size:9px;opacity:.8;font-weight:700}
.touchpad.flip{transform:rotate(180deg)}

/* split-screen divider */
#divider{position:absolute;z-index:4;background:var(--line);pointer-events:none}

/* ============================================================
   OVERLAYS
   ============================================================ */
.veil{
  position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + var(--safe-t));padding-bottom:calc(16px + var(--safe-b));
}
.veil.on{display:flex}
.sheet{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  width:100%;max-width:620px;max-height:100%;display:flex;flex-direction:column;
  box-shadow:var(--glow);animation:rise .2s ease;
}
.sheet.wide{max-width:920px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line-soft)}
.sheet header h2{font-size:19px;flex:1}
.sheet .body{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line-soft)}
.sheet footer .left{margin-right:auto}

/* results table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.stats{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.stats th{
  text-align:right;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.stats th:first-child,table.stats td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.stats td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line-soft);font-family:var(--mono)}
table.stats td.name{font-family:var(--font);font-weight:700;white-space:nowrap}
table.stats tr.win td{background:var(--accent-soft)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
.awards{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.award{
  border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;background:var(--bg2);
}
.award b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}

/* help */
.helpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.helpblock h4{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.helpblock p{margin:0 0 8px;color:var(--muted);font-size:13.2px}
.keyline{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12.5px;color:var(--muted)}
kbd{
  font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--text);font-weight:700;
}
.traplegend{display:grid;gap:8px}
.tlrow{display:flex;gap:9px;align-items:flex-start;font-size:12.8px}

/* ------------------------------ helpers ------------------------------ */
var $  = function(id){ return document.getElementById(id); };

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function dist2(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function dist(ax,ay,bx,by){ return Math.sqrt(dist2(ax,ay,bx,by)); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function rint(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60); var r=s%60; return m+":"+(r<10?"0":"")+r; }

/* ------------------------------ world constants ------------------------------ */
var GW = 21, GH = 15, TILE = 36;

/* ------------------------------ traps ------------------------------ */

  rapid:   { key:"rapid",   name:"Machine Pistol", dmg:4,  spd:560, cd:0.11, mag:12, rl:1.55, pellets:1, spread:0.095, kb:0.0, life:1.1, sz:2.6 },
  shotgun: { key:"shotgun", name:"Shotgun",        dmg:5,  spd:430, cd:0.74, mag:3,  rl:1.65, pellets:4, spread:0.200, kb:1.0, life:0.45, sz:2.8 },

  missile: { key:"missile", name:"Seeker",         dmg:11, spd:290, cd:0.95, mag:4,  rl:1.70, pellets:1, spread:0.010, kb:1.0, life:2.6, sz:4.4, homing:2.7 },
  fist:    { key:"fist",    name:"Rocket Fist",    dmg:14, spd:350, cd:1.15, mag:2,  rl:1.90, pellets:1, spread:0.010, kb:1.7, life:0.85, sz:6.5 },
  magnum:  { key:"magnum",  name:"Magnum",         dmg:12, spd:650, cd:0.62, mag:5,  rl:1.50, pellets:1, spread:0.020, kb:0.6, life:1.5, sz:3.6 }
};
var WEAPON_ORDER = ["pistol","rapid","kunai","shotgun","magnum","missile","fist"];

var MELEE = { dmg:9, range:30, cd:0.55, kb:1.1 };

/* ------------------------------ frames ------------------------------ */
var FRAMES = {
  light:    { key:"light",    name:"Light",    hp:86,  spd:1.16, note:"Fast, fragile" },
  standard: { key:"standard", name:"Standard", hp:100, spd:1.00, note:"Balanced" },
  heavy:    { key:"heavy",    name:"Heavy",    hp:124, spd:0.88, note:"Slow, tough" }
};
var FRAME_ORDER = ["light","standard","heavy"];

/* ------------------------------ loadout presets ------------------------------ */
var PRESETS = [
  { name:"Sapper",   frame:"standard", weapon:"pistol",  kit:{mine:4,bomb:3,swch:1} },
  { name:"Enforcer", frame:"heavy",    weapon:"shotgun", kit:{bomb:4,swch:1,gas:2} },
  { name:"Ghost",    frame:"light",    weapon:"kunai",   kit:{mine:3,pit:4,shove:5} },
  { name:"Warden",   frame:"standard", weapon:"missile", kit:{swch:3,pit:3,shove:3} },
  { name:"Brute",    frame:"heavy",    weapon:"fist",    kit:{mine:4,pit:6,gas:2} },
