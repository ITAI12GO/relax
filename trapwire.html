   INPUT — keyboard seats and touch pads
   ========================================================================== */
var KEYMAP = {
  kb1: { up:["KeyW"], down:["KeyS"], left:["KeyA"], right:["KeyD"],
         fire:["Space"], place:["KeyF"], cycle:["KeyQ"], scan:["ShiftLeft"], det:["KeyE"] },
  kb2: { up:["ArrowUp"], down:["ArrowDown"], left:["ArrowLeft"], right:["ArrowRight"],
         fire:["Period","Numpad0"], place:["Comma","Numpad1"], cycle:["KeyM","Numpad2"],
         scan:["ShiftRight","NumpadDecimal"], det:["Slash","Numpad3"] }
};
var SEAT_LABEL = { ai:"AI", kb1:"KEYS 1", kb2:"KEYS 2", touchA:"TOUCH 1", touchB:"TOUCH 2", off:"OFF" };

var Input = (function(){
  var st = {};
  function blank(){ return { up:0,down:0,left:0,right:0,fire:0,scan:0, placeQ:0, cycleQ:0, detQ:0, ax:0, ay:0, touch:false }; }
  ["kb1","kb2","touchA","touchB"].forEach(function(k){ st[k]=blank(); });

  function findSeatForCode(code){
    var out=[];
    ["kb1","kb2"].forEach(function(seat){
      var m=KEYMAP[seat];
      for(var act in m){ if(m[act].indexOf(code)>=0) out.push([seat,act]); }
    });
    return out;
  }
  function onKey(e, down){
    var ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    var gs = document.getElementById("game");
    if(!gs || !gs.classList.contains("on")) return;
    var hits = findSeatForCode(e.code);
    if(!hits.length) return;
    e.preventDefault();
    for(var i=0;i<hits.length;i++){
      var seat=hits[i][0], act=hits[i][1], s=st[seat];
      if(act==="place"){ if(down && !s._p){ s.placeQ++; } s._p=down; }
      else if(act==="cycle"){ if(down && !s._c){ s.cycleQ++; } s._c=down; }
      else if(act==="det"){ if(down && !s._d){ s.detQ++; } s._d=down; }
      else s[act] = down?1:0;
    }
  }

  /* ---------- touch ---------- */
  var pads = {};
  function clearPads(){
    var layer=$("touchLayer");
    if(layer) layer.innerHTML="";
    pads = {};
  }
  function layoutTouch(){
    var layer = $("touchLayer");
    if(!layer) return;
    clearPads();
    if(!G) return;
    var seats = [];
    for(var i=0;i<G.fighters.length;i++){
      var f=G.fighters[i];
      if(f.seat==="touchA"||f.seat==="touchB") seats.push(f);
    }
    if(!seats.length) return;
    var stage = $("stage");
    var full = { x:0, y:0, w:stage.clientWidth, h:stage.clientHeight, rot:0 };
    for(var s=0;s<seats.length;s++){
      var f2=seats[s];
      var vp = null;
      for(var v=0;v<VIEW.length;v++) if(VIEW[v].seat===f2.seat) vp=VIEW[v];
      /* a lone touch player gets the whole screen for their thumbs */
      if(!vp || VIEW.length===1) vp = full;
      buildPad(layer, f2, vp, vp.rot !== 0);
    }
  }
  function buildPad(layer, fighter, vp, flip){
    var pad = document.createElement("div");
    pad.className = "touchpad" + (flip?" flip":"");
    pad.style.cssText = "left:"+vp.x+"px;top:"+vp.y+"px;width:"+vp.w+"px;height:"+vp.h+"px;";
    pad.style.setProperty("--pc", fighter.col);

    var small = Math.min(vp.w, vp.h) < 330;
    var sz = small ? 100 : 124;
    var bs = small ? 50 : 60;

    var stick = document.createElement("div");
    stick.className = "stick";
    stick.style.cssText = "width:"+sz+"px;height:"+sz+"px;left:14px;bottom:14px;top:auto;";
    stick.innerHTML = '<div class="knob"></div>';
    pad.appendChild(stick);

    var btns = document.createElement("div");
    btns.className = "tbtns";
    btns.style.cssText = "right:14px;bottom:14px;grid-template-columns:repeat(2,auto);align-items:end;justify-items:center;";
    var defs = [
      {a:"scan",  t:"SCAN",  sub:"hold"},
      {a:"det",   t:"BOOM",  sub:"switch"},
      {a:"cycle", t:"NEXT",  sub:"trap"},
      {a:"place", t:"TRAP",  sub:""},
      {a:"fire",  t:"FIRE",  sub:"", big:true}
    ];
    defs.forEach(function(d){
      var b=document.createElement("button");
      b.className="tbtn"+(d.big?" big":"");
      b.style.width = (d.big? bs*1.3 : bs)+"px"; b.style.height=(d.big? bs*1.3 : bs)+"px";
      b.innerHTML = d.t + (d.sub?'<small>'+d.sub+'</small>':"");
      b.dataset.act = d.a;
      if(d.big) b.style.gridColumn="span 2";
      btns.appendChild(b);
    });
    pad.appendChild(btns);
    layer.appendChild(pad);

    var seat = fighter.seat, S = st[seat];
    S.touch = true;
    pads[seat] = { el:pad, stick:stick, flip:flip, pid:null, cx:0, cy:0, r:sz/2 };

    /* stick */
    stick.addEventListener("pointerdown", function(e){
      e.preventDefault();
      var r=stick.getBoundingClientRect();
      pads[seat].pid = e.pointerId;
      pads[seat].cx = r.left+r.width/2; pads[seat].cy = r.top+r.height/2;
      stick.setPointerCapture(e.pointerId);
      moveStick(seat, e.clientX, e.clientY);
    });
    stick.addEventListener("pointermove", function(e){
      if(pads[seat].pid !== e.pointerId) return;
      e.preventDefault();
      moveStick(seat, e.clientX, e.clientY);
    });
    function endStick(e){
      if(pads[seat].pid !== e.pointerId) return;
      pads[seat].pid=null; S.ax=0; S.ay=0;
      stick.querySelector(".knob").style.transform="";
    }
    stick.addEventListener("pointerup", endStick);
    stick.addEventListener("pointercancel", endStick);
    stick.addEventListener("lostpointercapture", endStick);

    /* buttons */
    Array.prototype.forEach.call(btns.children, function(b){
      var act=b.dataset.act;
      b.addEventListener("pointerdown", function(e){
        e.preventDefault(); b.classList.add("act");
        b.setPointerCapture(e.pointerId);
        if(act==="fire"||act==="scan") S[act]=1;
        else if(act==="place") S.placeQ++;
        else if(act==="cycle") S.cycleQ++;
        else if(act==="det") S.detQ++;
      });
      function up(e){ b.classList.remove("act"); if(act==="fire"||act==="scan") S[act]=0; }
      b.addEventListener("pointerup", up);
      b.addEventListener("pointercancel", up);
      b.addEventListener("lostpointercapture", up);
    });
  }
  function moveStick(seat, cx, cy){
    var pd = pads[seat], S = st[seat];
    var dx = cx - pd.cx, dy = cy - pd.cy;
    if(pd.flip){ dx=-dx; dy=-dy; }
    var m = Math.hypot(dx,dy), max = pd.r;
    var k = m>max ? max/m : 1;
    S.ax = (dx*k)/max; S.ay = (dy*k)/max;
    var knob = pd.stick.querySelector(".knob");
    knob.style.transform = "translate("+(dx*k)+"px,"+(dy*k)+"px)";
  }

  /* ---------- per-frame ---------- */
  function apply(){
    if(!G || G.state==="over") { return; }
    for(var i=0;i<G.fighters.length;i++){
      var p = G.fighters[i];
      if(p.seat==="ai") continue;
      var s = st[p.seat];
      if(!s){ continue; }
      if(!p.alive){ s.placeQ=0; s.cycleQ=0; s.detQ=0; continue; }
      var ax = s.touch ? s.ax : (s.right - s.left);
      var ay = s.touch ? s.ay : (s.down - s.up);
      var m = Math.hypot(ax,ay);
      if(m>1){ ax/=m; ay/=m; }
      p.ix = ax; p.iy = ay;
      p.firing = !!s.fire;
      p.scanning = !!s.scan;
      p.aimLock = false;
      while(s.placeQ>0){ s.placeQ--; if(!placeTrap(p)) UI.flash("No "+TRAPS[p.sel].name+" left"); }
      while(s.cycleQ>0){ s.cycleQ--; cycleTrap(p,1); }
      while(s.detQ>0){ s.detQ--; if(!detonateSwitches(p)) UI.flash("No armed switch"); }
    }
  }
  function reset(){ for(var k in st){ var s=st[k]; var t=s.touch; st[k]=blank(); st[k].touch=t; } }

  window.addEventListener("keydown", function(e){ onKey(e,true); });
  window.addEventListener("keyup",   function(e){ onKey(e,false); });
  window.addEventListener("blur", function(){ reset(); });

  return { apply:apply, layoutTouch:layoutTouch, reset:reset, clearPads:clearPads, state:st };
})();

    var host=$("hud"); if(!host) return;
    host.innerHTML=""; hudRefs=[];
    if(!G) return;
    G.fighters.forEach(function(p){
      var el=document.createElement("div");
      el.className="pcard"; el.style.setProperty("--pc", p.col);
      el.innerHTML =
        '<div class="ptop"><span class="pname">'+esc(p.name)+'</span><span class="pkind">'+SEAT_LABEL[p.seat]+
        (p.seat==="ai"?' '+AI_TIERS[p.tier].name.slice(0,3).toUpperCase():"")+'</span></div>'+
        '<div class="hpbar"><i style="width:100%"></i></div>'+
        '<div class="prow"><span class="ammo"></span><span class="wn" style="margin-left:auto"></span></div>'+
        '<div class="traprow"></div>'+
        '<div class="statuspips"></div>';
      host.appendChild(el);
      hudRefs.push({ el:el, hp:el.querySelector(".hpbar i"), ammo:el.querySelector(".ammo"),
                     wn:el.querySelector(".wn"), traps:el.querySelector(".traprow"),
                     pips:el.querySelector(".statuspips"), p:p, lastSel:"", lastTraps:"" });
    });
    document.body.classList.toggle("dense-full", CFG.density==="full");
  }
  function updateHUD(){
    if(!G) return;
    var clock=$("clock");
    if(clock){
      clock.textContent = CFG.timeLimit ? fmtTime(G.timeLeft) : fmtTime(G.t);
      clock.classList.toggle("urgent", !!CFG.timeLimit && G.timeLeft < 25);
    }
    for(var i=0;i<hudRefs.length;i++){
      var r=hudRefs[i], p=r.p;
      r.el.classList.toggle("dead", !p.alive);
      r.hp.style.width = clamp(p.hp/p.maxHp*100,0,100)+"%";
      var mag = p.wpn.mag, ah="";
      for(var a=0;a<mag;a++) ah += '<i class="'+(a<p.ammo?"":"spent")+'"></i>';
      if(r.ammo.dataset.n !== p.ammo+"/"+mag){ r.ammo.innerHTML=ah; r.ammo.dataset.n=p.ammo+"/"+mag; }
      r.wn.textContent = p.reloadT>0 ? "RELOAD" : (p.unitAmmo>0 ? "UNIT x"+p.unitAmmo : p.wpn.name);
      r.wn.style.color = p.unitAmmo>0 ? "var(--bad)" : (p.reloadT>0?"var(--warn)":"var(--faint)");

      var key = p.sel+"|"+TRAP_ORDER.map(function(k){return p.traps[k]||0;}).join(",");
      if(key !== r.lastTraps){
        r.lastTraps = key;
        var th="";
        TRAP_ORDER.forEach(function(k){
          var n=p.traps[k]||0;
          if(n<=0 && p.startKit[k]<=0) return;
          th += '<span class="tchip'+(p.sel===k?" sel":"")+(n<=0?" zero":"")+'">'+
                '<i class="sw" style="background:'+TRAPS[k].color+'"></i>'+n+'</span>';
        });
        r.traps.innerHTML = th || '<span class="tchip zero">none</span>';
      }
      var ph="";
      if(p.speedT>0) ph += '<span class="spip spd">SPD</span>';
      if(p.shieldT>0) ph += '<span class="spip shd">SHIELD</span>';
      if(p.unitAmmo>0) ph += '<span class="spip unit">UNIT</span>';
      if(p.pitT>0) ph += '<span class="spip shd">PINNED</span>';
      if(r.pips.dataset.k !== ph){ r.pips.innerHTML=ph; r.pips.dataset.k=ph; }
    }
    /* spectator analytics */
    var spec=$("spectator");
    if(spec){
      var on = CFG.density==="spectator";
      spec.classList.toggle("hidden", !on);
      if(on){
        var max=1;
        G.fighters.forEach(function(p){ max=Math.max(max,p.round.dmgDealt); });
        var h="";
        G.fighters.forEach(function(p){
          h += '<div class="specrow" style="--pc:'+p.col+'"><span class="nm">'+esc(p.name)+'</span>'+
               '<span class="track"><i style="width:'+(p.round.dmgDealt/max*100)+'%"></i></span>'+
               '<span class="v">'+Math.round(p.round.dmgDealt)+'</span></div>';
        });
        h += '<div style="margin-top:7px;color:var(--faint);font-size:10.5px">Damage dealt this round</div>';
        $("specBody").innerHTML = h;
      }
    }
    /* round pips */
    var rp=$("roundPips");
    if(rp && G.series){
      var h2="";
      for(var q=1;q<=CFG.rounds;q++) h2 += '<i class="'+(q<G.round?"won":"")+'"></i>';
      if(rp.dataset.k !== h2){ rp.innerHTML=h2; rp.dataset.k=h2; }
    }
  }
  function renderFeed(){
    var el=$("feed"); if(!el||!G) return;
    el.innerHTML = G.feed.map(function(f){ return '<div class="feedline">'+f.html+'</div>'; }).join("");
  }
  function bigMessage(main, sub, ms){
    var el=$("bigmsg"); if(!el) return;
    el.innerHTML = main + (sub?"<small>"+sub+"</small>":"");
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("show"); }, ms||1400);
  }

  /* ---------------- results ---------------- */
  function showResults(){
    if(!G || G.resultShown) return;
    G.resultShown = true;
    paused = true;
    var win = G.winner>=0 ? G.fighters[G.winner] : null;
    var done = seriesDone();
    $("resTitle").textContent = done ? (CFG.rounds>1?"Match complete":"Round complete") : ("Round "+G.round+" complete");
    $("resSub").textContent = G.arena.name + " · " + (CFG.rounds>1 ? "Round "+G.round+" of "+CFG.rounds : "single round");

    var banner;
    if(win){
      banner = '<div style="font-size:22px;font-weight:800;color:'+win.col+'">'+esc(win.name)+' takes the round</div>'+
               '<div style="color:var(--muted);font-size:13px;margin-top:2px">'+
               Math.round(win.hp)+' / '+win.maxHp+' health left · '+win.round.kills+' knockout'+(win.round.kills===1?"":"s")+'</div>';
    } else {
      banner = '<div style="font-size:22px;font-weight:800">Draw</div>'+
               '<div style="color:var(--muted);font-size:13px;margin-top:2px">Nobody came out ahead</div>';
    }
    $("resBanner").innerHTML = banner;

    var cols = [
      ["Fighter",  function(p){ return '<span class="dotc" style="background:'+p.col+'"></span>'+esc(p.name); }, "name"],
      ["Rounds",   function(p){ return G.series.wins[p.id]||0; }],
      ["KO",       function(p){ return p.round.kills; }],
      ["Down",     function(p){ return p.round.deaths; }],
      ["Damage",   function(p){ return Math.round(p.round.dmgDealt); }],
      ["Taken",    function(p){ return Math.round(p.round.dmgTaken); }],
      ["Trap dmg", function(p){ return Math.round(p.round.trapDmg); }],
      ["Set",      function(p){ return p.round.trapsSet; }],
      ["Hits",     function(p){ return p.round.trapHits; }],
      ["Disarm",   function(p){ return p.round.disarms; }],
      ["Lost",     function(p){ return p.round.trapsLost; }],
      ["Acc",      function(p){ return pct(p.round.hits, p.round.shots)+"%"; }],
      ["Chain",    function(p){ return "x"+(p.round.bestChain||0); }],
      ["Items",    function(p){ return p.round.pickups; }],
      ["Alive",    function(p){ return Math.round(p.round.alive)+"s"; }]
    ];
    var th = "<tr>"+cols.map(function(c){ return "<th>"+c[0]+"</th>"; }).join("")+"</tr>";
    var rows = G.fighters.slice().sort(function(a,b){
      return (b.round.roundsWon||0)-(a.round.roundsWon||0) || b.round.dmgDealt-a.round.dmgDealt;
    }).map(function(p){
      return '<tr class="'+(win&&win.id===p.id?"win":"")+'">'+cols.map(function(c){
        return '<td class="'+(c[2]||"")+'">'+c[1](p)+'</td>';
      }).join("")+'</tr>';
    }).join("");
    $("resTable").innerHTML = th + rows;

    var awards = [
      ["Most damage",   best(function(p){return p.round.dmgDealt;}, function(v){return Math.round(v);})],
      ["Best chain",    best(function(p){return (p.round.bestChain||0) >= 2 ? p.round.bestChain : 0;}, function(v){return "x"+v;})],
      ["Most disarms",  best(function(p){return p.round.disarms;})],
      ["Sharpest aim",  best(function(p){return p.round.shots>=4?pct(p.round.hits,p.round.shots):-1;}, function(v){return v+"%";})],
      ["Trap damage",   best(function(p){return p.round.trapDmg;}, function(v){return Math.round(v);})]
    ];
    $("resAwards").innerHTML = awards.filter(function(a){return a[1];}).map(function(a){
      return '<div class="award"><b>'+a[0]+'</b><span style="color:'+a[1].col+'">'+esc(a[1].name)+'</span> '+
             '<span class="mono" style="color:var(--muted)">'+a[1].v+'</span></div>';
    }).join("");

    if(done) commitSession();

    var sh = "";
    if(CFG.rounds>1){
      sh += '<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px">Series</div>';
      sh += '<div class="row">';
      G.fighters.forEach(function(p){
        sh += '<div class="kitpill"><i class="sw" style="width:9px;height:9px;border-radius:3px;background:'+p.col+
              ';display:inline-block"></i> '+esc(p.name)+' <b>'+(G.series.wins[p.id]||0)+'</b></div>';
      });
      sh += '</div>';
    }
    if(done && SESSION.matches > 0){
      sh += '<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px">'+
            'Session totals — '+SESSION.matches+' match'+(SESSION.matches===1?"":"es")+'</div>';
      var scols = [["Fighter",1],["Rounds",0],["KO",0],["Damage",0],["Trap dmg",0],["Disarms",0],["Acc",0]];
      sh += '<div class="tablewrap"><table class="stats" style="min-width:440px"><tr>'+
            scols.map(function(c){return "<th>"+c[0]+"</th>";}).join("")+"</tr>";
      G.fighters.forEach(function(p){
        var s = SESSION.byName[p.name] || blankStats();
        sh += '<tr><td class="name"><span class="dotc" style="background:'+p.col+'"></span>'+esc(p.name)+'</td>'+
              '<td>'+(s.roundsWon||0)+'</td><td>'+s.kills+'</td><td>'+Math.round(s.dmgDealt)+'</td>'+
              '<td>'+Math.round(s.trapDmg)+'</td><td>'+s.disarms+'</td><td>'+pct(s.hits,s.shots)+'%</td></tr>';
      });
      sh += '</table></div>';
    }
    $("resSeries").innerHTML = sh;

    $("resNext").classList.toggle("hidden", done);
    $("resRematch").textContent = done ? "Play again" : "Restart match";
    $("resVeil").classList.add("on");
  }
  function best(fn, fmt){
    var b=null, bv=-1;
    if(!G) return null;
    G.fighters.forEach(function(p){ var v=fn(p); if(v>bv && v>0){ bv=v; b=p; } });
    return b ? { name:b.name, col:b.col, v:(fmt?fmt(bv):bv) } : null;
  }
  function commitSession(){
    SESSION.matches++;
    G.fighters.forEach(function(p){
      var s = SESSION.byName[p.name] || (SESSION.byName[p.name]=blankStats());
      addStats(s, p.stats);
    });
  }

  /* ---------------- help ---------------- */
  function helpHTML(){
    var h = '<div class="helpgrid">';
    h += '<div class="helpblock"><h4>The idea</h4>'+
         '<p>Everyone drops hidden traps around the arena and then tries to steer the others onto them. '+
         'Shooting is how you interrupt someone, force them to move, and finish them off — the traps do the heavy damage.</p>'+
         '<p>Your own traps never hurt you. Rival traps stay invisible until you scan for them.</p>'+
         '<p>Last fighter standing wins the round. If the clock runs out, whoever has the most health takes it.</p></div>';

    h += '<div class="helpblock"><h4>Keyboard — player 1</h4>'+
         key("W A S D","Move")+key("Space","Fire (hold). Point-blank becomes a melee hit")+
         key("F","Drop the selected trap")+key("Q","Next trap")+
         key("Left Shift","Hold to scan and disarm")+key("E","Detonate all your switches")+'</div>';

    h += '<div class="helpblock"><h4>Keyboard — player 2</h4>'+
         key("Arrows","Move")+key(". or Num0","Fire")+key(", or Num1","Drop trap")+
         key("M or Num2","Next trap")+key("Right Shift","Scan / disarm")+key("/ or Num3","Detonate")+'</div>';

    h += '<div class="helpblock"><h4>Touch</h4>'+
         '<p>Left thumb steers, right thumb hits FIRE, TRAP, NEXT, SCAN and BOOM. '+
         'With two touch players the screen splits and the top half is turned around, so put the device flat between you.</p></div>';

    h += '<div class="helpblock"><h4>Scanning and disarming</h4>'+
         '<p>Hold SCAN to crawl. Rival traps within about three tiles light up as grey markers — you see that something is there, not what it is.</p>'+
         '<p>Stand on a marked trap and keep holding SCAN. After about a second and a half you take it: some health back, plus one of that trap added to your own belt. Get shot mid-disarm and it goes off in your face.</p></div>';

    h += '<div class="helpblock"><h4>Chains</h4>'+
         '<p>A blast sets off anything sitting next to it. A mine beside two bombs is a much bigger hole than three separate mines, and each link in the chain adds damage.</p>'+
         '<p>Switches are the reliable version of this — plant a pair, walk away, press Detonate when someone strolls past.</p></div>';

    h += '<div class="helpblock" style="grid-column:1/-1"><h4>Traps</h4><div class="traplegend">';
    TRAP_ORDER.forEach(function(k){
      var d=TRAPS[k];
      h += '<div class="tlrow"><i class="sw" style="background:'+d.color+'"></i><div><b>'+d.name+
           ' <span style="color:var(--faint);font-weight:600">'+d.cost+' kit point'+(d.cost>1?"s":"")+'</span></b>'+
           '<span>'+d.desc+'</span></div></div>';
    });
    h += '</div></div>';

    h += '<div class="helpblock" style="grid-column:1/-1"><h4>Dispensers</h4>'+
         '<p>The ringed pads are dispensers. They push out repair kits, trap crates, overdrive, ablative shielding — and occasionally THE UNIT, '+
         'a three-shot homing plasma cannon that hurts badly and ignores shielding. Hold fire to charge it. '+
         'Knock the carrier down with a shotgun, seeker or rocket fist and they drop it.</p>'+
         '<p>Under twenty-five seconds left, two spark bits are released into the arena and start bouncing around.</p></div>';

    h += '<div class="helpblock" style="grid-column:1/-1"><h4>If it runs rough</h4>'+
         '<p>The Graphics setting in the pause menu has three steps. High adds animated film grain, Balanced is the default, '+
         'Fast drops the grain, vignette and smoke. The game measures its own frame rate in the first few seconds of a round '+
         'and steps down on its own if it needs to — you can always override it.</p></div>';
    h += '</div>';
    return h;
  }
  function key(k, txt){
    return '<div class="keyline"><kbd>'+esc(k)+'</kbd><span>'+esc(txt)+'</span></div>';
  }

  /* ---------------- toast ---------------- */
  var tT;
  function flash(msg){
    var el=$("toast"); if(!el) return;
    el.textContent=msg; el.classList.add("on");
    clearTimeout(tT); tT=setTimeout(function(){ el.classList.remove("on"); }, 1500);
  }

  return { seg:seg, bindSeg:bindSeg, refreshSegs:refreshSegs, applyTheme:applyTheme,
           setPlayers:setPlayers, syncPlayers:syncPlayers,
           defaultSlots:defaultSlots, buildSlots:buildSlots, show:show,
           buildHUD:buildHUD, updateHUD:updateHUD, renderFeed:renderFeed, bigMessage:bigMessage,
           showResults:showResults, helpHTML:helpHTML, flash:flash };
})();

/* ==========================================================================
   MATCH LAUNCH
   ========================================================================== */
function activeCount(){
  var n=0; for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].seat!=="off") n++; return n;
}
function launch(){
  UI.syncPlayers();
  if(activeCount() < 2){ UI.flash("Need at least two fighters"); return; }
  computeViewports();
  var seen={};
  SLOTS.forEach(function(s){
    var base=s.name, n=2;
    while(seen[s.name]){ s.name = base.slice(0,13)+" "+n; n++; }
    seen[s.name]=1;
    var pts=0; for(var k in s.kit) pts += (s.kit[k]||0)*TRAPS[k].cost;
    if(pts===0){ s.kit = Object.assign({}, PRESETS[0].kit); }
  });
  startMatch();
  Input.reset();
  computeViewports();
  UI.buildHUD();
  UI.renderFeed();
  Input.layoutTouch();
  paused = false;
  UI.show("game");
  setTimeout(function(){ resizeCanvas(); Input.layoutTouch(); }, 60);
  UI.bigMessage(G.arena.name, "Round "+G.round, 1500);
  var kb = SLOTS.some(function(s){ return s.seat==="kb1" || s.seat==="kb2"; });
  if(kb) setTimeout(function(){ UI.flash("WASD move · Space fire · F trap · Q next · Shift scan · E detonate"); }, 1700);
}
function quickMatch(){
  UI.defaultSlots();
  var tiers=["regular","rookie","regular","veteran"];
  for(var i=0;i<4;i++){ SLOTS[i].seat="ai"; SLOTS[i].tier=tiers[i]; }
  SLOTS[0].seat = IS_TOUCH ? "touchA" : "kb1";
  UI.syncPlayers();
  CFG.rounds=3; CFG.timeLimit=120; CFG.camera="arena"; CFG.density="full";
  UI.refreshSegs(); launch();
}
function duelMatch(){
  if(CFG.players < 2) CFG.players = 2;
  UI.defaultSlots();
  for(var i=0;i<4;i++) SLOTS[i].seat="ai";
  if(IS_TOUCH){ SLOTS[0].seat="touchA"; SLOTS[1].seat="touchB"; }
  else { SLOTS[0].seat="kb1"; SLOTS[1].seat="kb2"; }
  SLOTS[2].tier="regular"; SLOTS[3].tier="rookie";
  UI.syncPlayers();
  CFG.rounds=3; CFG.timeLimit=120; CFG.camera="arena"; CFG.density="full";
  UI.refreshSegs(); launch();
}
function watchMatch(){
  UI.defaultSlots();
  var t2=["rookie","regular","veteran","elite"];
  for(var i=0;i<4;i++){ SLOTS[i].seat="ai"; SLOTS[i].tier=t2[i]; }
  UI.syncPlayers();
  CFG.rounds=3; CFG.timeLimit=120; CFG.camera="wide"; CFG.density="spectator";
  UI.refreshSegs(); launch();
}

/* ==========================================================================
   GRAPHICS DETAIL
   ========================================================================== */
function setDetail(v, manual){
  CFG.detail = v;
  if(manual) autoDetail.done = true;
  if(typeof SPR !== "undefined") SPR.sheetKey = "";
  UI.refreshSegs();
}
var autoDetail = { samples:[], done:false };
function sampleDetail(dt){
  if(autoDetail.done || !G || G.state !== "live") return;
  autoDetail.samples.push(dt);
  if(autoDetail.samples.length < 100) return;
  var s = autoDetail.samples.slice(20).sort(function(a,b){ return a-b; });
  var med = s[Math.floor(s.length/2)];
  autoDetail.done = true;
  if(med > 1/26 && CFG.detail !== "fast"){
    CFG.detail = "fast"; SPR.sheetKey = ""; UI.refreshSegs();
    UI.flash("Graphics set to Fast for a smoother frame rate");
  }
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
var lastTS = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = lastTS ? (ts-lastTS)/1000 : 0;
  lastTS = ts;
  dt = clamp(dt, 0, 0.06);
  if(G && !paused && $("game").classList.contains("on")){
    Input.apply();
    var sdt = dt * CFG.speed;
    var steps = clamp(Math.ceil(sdt/0.0167), 1, 8);
    for(var i=0;i<steps;i++) step(sdt/steps);
    if(G.state==="live" && G.stateT===0 && G.t<0.05) UI.bigMessage("GO", "", 700);
  }
  render(dt);
  UI.updateHUD();
  if(dt>0) sampleDetail(dt);
}

    UI.refreshSegs(); UI.flash("Speed "+CFG.speed+"x");
  };

  $("resNext").onclick = function(){
    $("resVeil").classList.remove("on");
    resetRound(G.round+1);
    UI.buildHUD(); UI.renderFeed(); Input.reset(); Input.layoutTouch();
    paused=false;
    UI.bigMessage(G.arena.name, "Round "+G.round, 1500);
  };
  $("resRematch").onclick = function(){
    $("resVeil").classList.remove("on");
    launch();
  };
  $("resQuit").onclick = function(){
    $("resVeil").classList.remove("on"); paused=false; G=null;
    Input.clearPads(); UI.show("menu");
  };

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      if($("helpVeil").classList.contains("on")){ $("helpVeil").classList.remove("on"); return; }
      if($("resVeil").classList.contains("on")) return;
      if($("game").classList.contains("on")){
        var v=$("pauseVeil");
        if(v.classList.contains("on")){ v.classList.remove("on"); paused=false; Input.reset(); }
        else { v.classList.add("on"); paused=true; UI.refreshSegs(); }
      }
    }
    if(e.key==="p"||e.key==="P"){
      if($("game").classList.contains("on") && !$("resVeil").classList.contains("on")){
        var vv=$("pauseVeil");
        if(vv.classList.contains("on")){ vv.classList.remove("on"); paused=false; Input.reset(); }
        else { vv.classList.add("on"); paused=true; UI.refreshSegs(); }
      }
    }
  });

  document.addEventListener("contextmenu", function(e){
    if($("game").classList.contains("on")) e.preventDefault();
  });

  requestAnimationFrame(frame);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
