function mutateDraft(type,value){if(!draft)return;if(type==='upgrade'){const lv=draft.levels[value];if(lv>=5||draft.points<cost(lv))return;draft.points-=cost(lv);draft.levels[value]++;Audio.fx('buy')}else if(type==='refund'){const lv=draft.levels[value];if(lv<=baseline.levels[value])return;draft.levels[value]--;draft.points+=cost(lv-1)}else if(type==='reset-draft')draft=copy(baseline);else draft[type]=value;const s1=$('.loadout-panel')?.scrollTop||0,s2=$('.upgrade-panel')?.scrollTop||0;renderWorkshop();$('.loadout-panel').scrollTop=s1;$('.upgrade-panel').scrollTop=s2;const next=$$('[data-action="'+type+'"]').find(el=>el.dataset.value===value&&!el.disabled);if(next)next.focus({preventScroll:true})}

function setSpeed(v){if(!battle||![1,1.5,2].includes(v))return;if(battle.pilot&&v!==1){notify('Switch to Autopilot to speed up the duel.');return}battle.speed=v;$$('[data-action="speed"]').forEach(el=>{const selected=Number(el.dataset.value)===v;el.classList.toggle('active',selected);el.setAttribute('aria-pressed',String(selected))})}
function bindJoystick(){const joy=$('#joystick');if(!joy)return;const reset=()=>{input.pointer=null;input.joyX=0;input.joyY=0;if($('#joystick-knob'))$('#joystick-knob').style.transform='translate(0,0)'};const move=e=>{if(e.pointerId!==input.pointer)return;const r=joy.getBoundingClientRect(),max=r.width*.32;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const d=Math.hypot(x,y)||1;if(d>max){x=x/d*max;y=y/d*max}input.joyX=x/max;input.joyY=y/max;$('#joystick-knob').style.transform=`translate(${x}px,${y}px)`;e.preventDefault()};joy.addEventListener('pointerdown',e=>{if(input.pointer!==null)return;input.pointer=e.pointerId;joy.setPointerCapture(e.pointerId);Audio.init();move(e)});joy.addEventListener('pointermove',move);joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);joy.addEventListener('lostpointercapture',reset)}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else notify('This browser uses its own fullscreen view. Landscape gives you a wider arena.')}catch{notify('Fullscreen is unavailable here. The arena still fits this screen.')}}
function downloadGame(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#main').innerHTML='';clone.querySelector('#main').className='screen';clone.querySelector('#modal-root').innerHTML='';clone.querySelector('#toast').hidden=true;clone.querySelector('#announcer').textContent='';clone.querySelector('#app').removeAttribute('inert');clone.querySelector('body').className='';const url=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='bolt-pit.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Your game file is ready to save.')}
function resumeMatch(){match=loadSaved();if(!match){notify('No saved championship was found.');renderHome();return}match.players.forEach((p,i)=>{p.name=i===0?'PLAYER 1':match.config.mode==='ai'?'IRON AI':'PLAYER 2';p.color=i===0?'#d5ff5f':'#ff9272'});if(match.phase==='armed')renderFaceoff();else if(match.phase==='results'||match.phase==='final')renderResults();else startPrep()}
function homeAction(){if(screen==='home')return;if(screen==='battle'){openPause();return}if(screen==='workshop'){openModal('Leave the workshop?',`<p>Changes since entering this workshop will be discarded. Your locked builds and championship progress stay saved.</p><div class="actions"><button class="btn primary" data-action="close-modal">Keep building</button><button class="btn ghost" data-action="go-home">Main menu</button></div>`);return}renderHome()}
document.addEventListener('pointerdown',()=>Audio.init(),{passive:true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,v=el.dataset.value;Audio.init();if(action!=='sound'&&action!=='dash')Audio.fx('click');switch(action){
 case 'home':homeAction();break;case 'go-home':draft=null;renderHome();break;case 'mode':config.mode=v;renderHome();break;
 case 'round-minus':case 'round-plus':config.rounds=clamp((Number($('#round-count').value)||5)+(action==='round-plus'?1:-1),1,15);$('#round-count').value=config.rounds;break;
 case 'new-match':newMatch();break;case 'confirm-new':beginMatch();break;case 'resume':resumeMatch();break;
 case 'open-workshop':openWorkshop(Number(el.dataset.index));break;case 'chassis':case 'weapon':case 'module':case 'tactic':case 'upgrade':case 'refund':case 'reset-draft':mutateDraft(action,v);break;
 case 'work-tab':workTab=v;renderWorkshop();break;case 'lock-bot':lockBot();break;case 'fight':beginBattle();break;case 'next-round':nextRound();break;
 case 'rematch':config=copy(match.config);beginMatch();break;case 'finish-home':clearSaved();match=null;renderHome();break;
 case 'sound':prefs.sound=!prefs.sound;savePrefs();if(prefs.sound)Audio.fx('click');break;case 'fullscreen':fullscreen();break;case 'help':showHelp();break;case 'settings':showSettings();break;
 case 'close-modal':closeModal(true);break;case 'pref':prefs[v]=!prefs[v];savePrefs();showSettings();break;case 'download':downloadGame();break;
 case 'pause':if(battle&&!battle.finished){if(battle.paused){battle.paused=false;updatePauseButton()}else openPause()}break;
 case 'resume-battle':closeModal(false);if(battle){battle.paused=false;updatePauseButton()}break;
 case 'leave-battle':openModal('Save & leave the arena?',`<p>Your locked builds are saved. Returning will restart this round from full health; points are awarded only when a round finishes.</p><div class="actions"><button class="btn ghost" data-action="resume-battle">Keep fighting</button><button class="btn primary" data-action="go-home">Save & leave</button></div>`);break;
 case 'camera':if(battle){battle.camera=battle.camera==='follow'?'full':'follow';$('#camera-btn').setAttribute('aria-label',battle.camera==='follow'?'Show the full arena':'Follow the robots');notify(battle.camera==='follow'?'Camera follows both bots.':'Full arena view.')}break;case 'pilot':togglePilot();break;case 'speed':setSpeed(Number(v));break;case 'dash':if(battle&&battle.pilot)dash(battle.bots[0]);break;
 }});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='round-count'){config.rounds=clamp(Math.round(Number(el.value))||5,1,15);el.value=config.rounds}if(el.id==='round-time')config.seconds=Number(el.value);if(el.id==='difficulty')config.difficulty=el.value;if(el.id==='control')config.control=el.value});
document.addEventListener('keydown',e=>{const modal=$('.modal');if(modal){if(e.key==='Escape'){e.preventDefault();closeModal(true)}if(e.key==='Tab'){const f=[...modal.querySelectorAll('button:not(:disabled),a[href],input,select,[tabindex="0"]')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}if(screen!=='battle'||!battle||battle.finished)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();input.keys.add(e.code)}if(e.code==='Space'&&!e.repeat&&battle.pilot)dash(battle.bots[0]);if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat){e.preventDefault();openPause()}});
document.addEventListener('keyup',e=>input.keys.delete(e.code));
document.addEventListener('visibilitychange',()=>{if(document.hidden){input.keys.clear();input.joyX=0;input.joyY=0;if(battle&&!battle.paused&&!battle.finished)openPause();if(Audio.ctx)Audio.ctx.suspend().catch(()=>{})}lastTime=0});
window.addEventListener('blur',()=>{input.keys.clear();input.joyX=0;input.joyY=0;if(battle&&!battle.paused&&!battle.finished)openPause()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.arena-wrap'))e.preventDefault()});
function frame(ts){const dt=lastTime?Math.min(.06,(ts-lastTime)/1000):0;lastTime=ts;uiClock+=dt;const time=ts/1000;if(battle&&screen==='battle'&&!battle.paused){if(battle.countdown>0){battle.countdown=Math.max(0,battle.countdown-dt);const step=Math.ceil(battle.countdown);if(step!==battle.countStep){battle.countStep=step;if(step>0){$('#count-text').textContent=step;Audio.fx('count')}else{$('#count-text').textContent='FIGHT';Audio.fx('go');battle.goTime=.55}}}else if(battle.finished){battle.endDelay-=dt;updateEffects(dt);if(battle.endDelay<=0){renderResults()}}else{if(battle.goTime>0){battle.goTime-=dt;if(battle.goTime<=0)$('#count-text').hidden=true}battle.accumulator+=dt*battle.speed;let steps=0;while(battle&&battle.accumulator>=1/60&&steps++<20&&!battle.finished){simulate(1/60);battle.accumulator-=1/60}updateEffects(dt*battle.speed);Audio.music()}if(screen==='battle'&&uiClock>.08){updateHUD();uiClock=0}}
 for(const item of drawCanvases){if(item.kind==='arena'){if(battle)drawArena(item.el,time)}else drawPreview(item,time)}requestAnimationFrame(frame)}
function registerAgentTools(){const ctx=document.modelContext;if(!ctx?.registerTool)return;const lifecycle=new AbortController();const definitions=[{name:'get_championship_state',title:'Read championship state',description:'Read the current screen, round, and public score. Private bot preparations are never exposed.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {screen,mode:match?.config.mode||config.mode,round:match?.round||null,rounds:match?.config.rounds||config.rounds,scores:match?.players.map(p=>p.score)||null}}},{name:'configure_championship',title:'Configure a new championship',description:'Set new championship options on the main menu. Does not start a match or replace saved progress.',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['ai','local']},rounds:{type:'integer',minimum:1,maximum:15}},required:['mode','rounds'],additionalProperties:false},annotations:{readOnlyHint:false},execute(value){if(screen!=='home')throw new Error('Return to the main menu before configuring a match.');if(!value||!['ai','local'].includes(value.mode)||!Number.isInteger(value.rounds)||value.rounds<1||value.rounds>15)throw new Error('Choose ai or local and 1 to 15 rounds.');config.mode=value.mode;config.rounds=value.rounds;renderHome();return {screen,mode:config.mode,rounds:config.rounds,started:false}}}];for(const def of definitions){try{Promise.resolve(ctx.registerTool(def,{signal:lifecycle.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
$('#fullscreen-btn').innerHTML=icon('expand');$('[data-action="help"]').innerHTML=icon('help');$('[data-action="settings"]').innerHTML=icon('gear');updateSoundButton();renderHome();registerAgentTools();requestAnimationFrame(frame);
})();
</script></body></html>
