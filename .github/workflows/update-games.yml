name: Update Game Hub

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "scripts/build-games.mjs"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create package file
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Generate covers and games.json
        run: |
          node scripts/build-games.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add covers games.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Auto-update game covers and game list"
            git push
          fi
